name: Reloc
options:
  bundleIdPrefix: dev.reloc
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

targets:
  Reloc:
    type: application
    platform: iOS
    sources:
      - path: Reloc/Core
      - path: Reloc/UI
      - path: Reloc/Resources/Assets.xcassets
      - path: Reloc/Resources/MFi
        buildPhase: resources
        type: folder
    info:
      path: Reloc/Info.plist
      properties:
        CFBundleDisplayName: Reloc
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "2"
        LSRequiresIPhoneOS: true
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Reloc Pairing Record
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - dev.reloc.rppairing
              - dev.reloc.mobiledevicepairing
              - com.apple.property-list
              - public.xml
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: dev.reloc.rppairing
            UTTypeDescription: Remote Pairing File
            UTTypeConformsTo:
              - public.data
              - public.content
              - com.apple.property-list
            UTTypeTagSpecification:
              public.filename-extension:
                - rppairing
          - UTTypeIdentifier: dev.reloc.mobiledevicepairing
            UTTypeDescription: Mobile Device Pairing File
            UTTypeConformsTo:
              - public.data
              - public.content
              - com.apple.property-list
            UTTypeTagSpecification:
              public.filename-extension:
                - mobiledevicepairing
                - mobilepair
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: RelocはローカルネットワークでこのiPhoneを見つけてペアリングします。ループバックは外部プロキシが提供します。
        NSBonjourServices:
          - _remotepairing-pairable-host._tcp
          - _remotepairing._tcp
        NSLocationWhenInUseUsageDescription: 位置情報の注入中、Relocをバックグラウンドで動かして、システムの位置情報サービスに購読を促すために使います。
        NSLocationAlwaysAndWhenInUseUsageDescription: 位置情報の注入中、Relocをバックグラウンドで継続して動かし、システムに中断されて位置情報が途切れるのを防ぐために使います。
        UIBackgroundModes:
          - location
          - audio
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.reloc.ios
        SWIFT_OBJC_BRIDGING_HEADER: Reloc/Core/ObjC/Reloc-Bridging-Header.h
        INFOPLIST_FILE: Reloc/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - framework: Vendor/RelocDeviceBridge.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: MapKit.framework
      - sdk: CoreLocation.framework
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
